name: quality

on:
  pull_request:
  push:
    branches: [main, release/v1-freeze-20260828]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-test.txt
      - run: echo "ICHI_IMAGE_DECODER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: pnpm quality
